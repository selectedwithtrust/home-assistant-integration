rules:
  # Bronze
  action-setup: {status: exempt, comment: Integration registers no actions.}
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: {status: exempt, comment: No actions.}
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions: {status: exempt, comment: No actions.}
  config-entry-unloading: done
  docs-configuration-parameters: {status: exempt, comment: No options.}
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: {status: exempt, comment: The public API needs no authentication.}
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: {status: exempt, comment: Cloud service, nothing to discover.}
  discovery: {status: exempt, comment: Cloud service, nothing to discover.}
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: {status: exempt, comment: Cloud service.}
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: {status: exempt, comment: One device per entry.}
  entity-category: {status: exempt, comment: All entities are primary.}
  entity-device-class: done
  entity-disabled-by-default: {status: exempt, comment: Only a handful of useful entities.}
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: {status: exempt, comment: One device per entry, removed with it.}
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
